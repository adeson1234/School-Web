<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="/images/logo.png">
  <link rel="stylesheet" href="/beauty/cssTaskBar.css">
  <link rel="stylesheet" href="/beauty/cssTracking.css">
  <title>BAHRADAR</title>
</head>
<body>
  <div class="top-menu">
    <button>HOME</button>
    <button class="active">SHOPPING</button>
    <button>CALCULATIONS</button>
    <button>GAMES</button>
  </div>
  
  <div class="order-card">
    <div class="icon-circle">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="20 6 9 17 4 12"></polyline>
      </svg>
    </div>
    
    <h2>Thank you for your order!</h2>
    <p class="subtitle">We’ve received your purchase and are getting it ready.</p>
    
    <div class="details-box">
      <div class="detail-row">
        <span>ESTIMATED DELIVERY</span>
        <strong>1 to 7 Business Days</strong>
      </div>
      <div class="detail-row">
        <span>ITEMS SHIPMENT</span>
        <strong style="color:#6b7280; font-size:0.85rem;">May arrive separately</strong>
      </div>
    </div>
  
    <button class="btn-primary" onclick="window.location.href='/SHOPPING.html'">Continue Shopping</button>
  </div>

  <script type="module" src="/scripts/tracking.js"></script>
</body>
</html>
