<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="/images/logo.png">
  <link rel="stylesheet" href="/beauty/cssTaskBar.css">
  <link rel="stylesheet" href="/beauty/cssSnakegame.css">
  <title>Snake Game</title>
</head>
<body>
  <div class="top-menu">
    <button>HOME</button>
    <button>SHOPPING</button>
    <button>CALCULATIONS</button>
    <button class="active">GAMES</button>
  </div>

  <h1>Snake</h1>
  <canvas id="game" width="500" height="500"></canvas>

  <div class="controls">
    <button id="btn-up" class="btn btn-up">▲</button>
    <div class="horizontal-btns">
      <button id="btn-left" class="btn">◀</button>
      <button id="btn-down" class="btn">▼</button>
      <button id="btn-right" class="btn">▶</button>
    </div>
  </div>

  <script type="module" src="/scripts/snakeGame.js"></script>
</body>
</html>
